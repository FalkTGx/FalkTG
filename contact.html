<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | FalkTG</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <canvas id="skyline-canvas"></canvas>
  <div class="wrap">
    <header class="nav"><div class="nav-inner">
      <a class="brand" href="index.html"><img data-media="mark" alt="FalkTG"><b>FalkTG</b></a>
      <button class="nav-toggle" aria-label="Menu">☰</button>
      <nav class="nav-bar">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="fint.html">Financial Institutions</a>
        <a class="nav-link" href="pint.html">Public Institutions</a>
        <a class="nav-link active" href="contact.html">Contact</a>
      </nav>
    </div></header>
    <section class="section" style="padding-top:5rem">
      <div class="section-head"><p class="kicker">Contact</p><h2>Start a mandate</h2><p class="muted">Choose the desk first. Then the house.</p></div>
      <form class="form" id="contact-form">
        <input type="hidden" name="type" value="">
        <input type="hidden" name="fin_kind" value="">
        <input type="hidden" name="pub_kind" value="">
        <div class="choice-row">
          <button type="button" class="choice" data-choice="type" data-value="financial">Financial Institution<small>Banks, firms, fintechs</small></button>
          <button type="button" class="choice" data-choice="type" data-value="public">Public Institution<small>Admin and politics</small></button>
          <button type="button" class="choice" data-choice="type" data-value="other">Other<small>Press, speaking, else</small></button>
        </div>
        <div id="fin-row" class="choice-row hidden">
          <button type="button" class="choice" data-choice="fin_kind" data-value="bank">Bank</button>
          <button type="button" class="choice" data-choice="fin_kind" data-value="ifpf">Investment / payment firm</button>
          <button type="button" class="choice" data-choice="fin_kind" data-value="fintech">FinTech — Start-up</button>
        </div>
        <div id="pub-row" class="choice-row hidden">
          <button type="button" class="choice" data-choice="pub_kind" data-value="admin">Administration</button>
          <button type="button" class="choice" data-choice="pub_kind" data-value="politician">Parliamentary group / politician</button>
          <button type="button" class="choice" data-choice="pub_kind" data-value="other_pub">Other public</button>
        </div>
        <label>Name <input name="name" required></label>
        <label>Email <input type="email" name="email" required></label>
        <label>Message <textarea name="message" required></textarea></label>
        <button class="btn btn-gold" type="submit">Send inquiry</button>
        <p class="note">Opens your mail client to consulting@falk-gebhardt.de.</p>
      </form>
    </section>
    <footer class="footer"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></footer>
  </div>
  <script src="js/media.js"></script><script src="js/main.js"></script>
</body></html>
