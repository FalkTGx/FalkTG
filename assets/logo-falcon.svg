<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="FalkTG golden falcon">
  <defs>
    <linearGradient id="goldBody" x1="10%" y1="0%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#faf0d0"/>
      <stop offset="18%" stop-color="#e8c95c"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="65%" stop-color="#b08a22"/>
      <stop offset="85%" stop-color="#8a6a16"/>
      <stop offset="100%" stop-color="#5a3e0a"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a227"/>
      <stop offset="50%" stop-color="#7a5c12"/>
      <stop offset="100%" stop-color="#2e2006"/>
    </linearGradient>
    <linearGradient id="goldBeak" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#faf0d0"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#a07818"/>
      <stop offset="100%" stop-color="#5a3e0a"/>
    </linearGradient>
    <linearGradient id="wingTop" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#e8c95c"/>
      <stop offset="50%" stop-color="#b08a22"/>
      <stop offset="100%" stop-color="#6a4e0d"/>
    </linearGradient>
    <linearGradient id="wingBottom" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#8a6a16"/>
      <stop offset="100%" stop-color="#3d2c08"/>
    </linearGradient>
    <linearGradient id="breast" x1="40%" y1="10%" x2="60%" y2="90%">
      <stop offset="0%" stop-color="#faf0d0"/>
      <stop offset="40%" stop-color="#f0d78c"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="iris" cx="42%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#faf0d0"/>
      <stop offset="40%" stop-color="#d4a020"/>
      <stop offset="75%" stop-color="#8a6a16"/>
      <stop offset="100%" stop-color="#2a1c06"/>
    </radialGradient>
    <radialGradient id="rimLight" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="rgba(250,240,208,.25)"/>
      <stop offset="100%" stop-color="rgba(250,240,208,0)"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur"/>
      <feFlood flood-color="#d4af37" flood-opacity="0.3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <circle cx="128" cy="128" r="124" fill="#07090e"/>
  <circle cx="128" cy="128" r="122" fill="none" stroke="url(#goldBody)" stroke-width="3" opacity="0.6"/>
  <circle cx="128" cy="128" r="118" fill="none" stroke="url(#goldBody)" stroke-width="0.8" opacity="0.3"/>
  <!-- Body shadow -->
  <ellipse cx="130" cy="172" rx="48" ry="14" fill="#000" opacity="0.15"/>
  <!-- Tail feathers -->
  <path fill="url(#wingBottom)" d="M52 178c-6-4-14-16-16-28 2-6 8-10 14-8 8 4 12 14 14 24-4 4-8 8-12 12z"/>
  <path fill="#5a3e0a" opacity="0.5" d="M48 162c-2-6-4-14-2-20 4-2 8 0 10 4 2 6 0 12-2 16z"/>
  <path fill="url(#goldDark)" d="M56 182c-8-2-18-14-22-28-2-8 2-14 8-14 8 2 14 10 18 22 0 6-2 14-4 20z"/>
  <!-- Main body -->
  <path fill="url(#goldDark)" d="M58 168c8-38 28-70 62-86 18-8 38-10 56-2 14 6 26 18 32 32 8 18 6 38-4 54-14 24-40 38-68 44-28 6-56 2-78-12-8-6-8-16 0-30z" filter="url(#glow)"/>
  <!-- Body detail / feather texture -->
  <path fill="url(#goldBody)" opacity="0.35" d="M72 160c6-24 20-48 42-62 10-6 22-8 32-4-18 4-34 18-46 38-8 12-14 24-16 38-4-2-8-6-12-10z"/>
  <path fill="#5a3e0a" opacity="0.2" d="M80 170c4-16 14-34 28-46 8-6 18-10 26-8-14 6-26 18-36 34-4 6-8 14-10 22-4-2-6-4-8-2z"/>
  <!-- Wing (upper) -->
  <path fill="url(#wingTop)" d="M92 78c18-22 40-34 66-32 16 1 30 8 38 20-18-6-38-6-56 2-16 8-30 18-48 10z"/>
  <!-- Wing feather details -->
  <path fill="#b08a22" opacity="0.4" d="M102 82c12-14 28-24 46-26 8 0 16 2 22 6-14 0-28 6-40 14-8 4-18 6-28 6z"/>
  <path fill="#8a6a16" opacity="0.3" d="M112 78c8-8 20-16 34-18 6 2 10 4 14 8-12 0-24 4-34 10-4 2-10 2-14 0z"/>
  <!-- Wing shadow -->
  <path fill="#6a4e0d" opacity="0.45" d="M86 96c22-16 46-22 70-16 8 12-4 22-18 26-18 6-34 4-52-10z"/>
  <!-- Breast / chest highlight -->
  <path fill="url(#breast)" d="M118 120c14-4 26-2 34 8 6 10 4 24-4 34-10 12-24 16-38 14-10-2-18-10-18-20 0-14 10-28 26-36z"/>
  <path fill="#faf0d0" opacity="0.15" d="M126 128c8-2 16 0 22 6 4 6 2 14-2 20-6 6-14 8-22 6-6-2-10-8-8-16 2-6 6-12 10-16z"/>
  <!-- Breast feather lines -->
  <path fill="none" stroke="#b08a22" stroke-width="0.8" opacity="0.35" d="M122 132c8-2 16 0 22 4M120 140c10 0 20 2 26 6M124 148c8 2 14 4 18 8"/>
  <!-- Eye area / face -->
  <path fill="#f3e2a4" d="M132 92c18 2 30 14 34 28-8 8-20 12-32 10-14-2-24-12-22-24 2-8 10-14 20-14z"/>
  <path fill="#2a1c06" d="M128 98c16 2 26 12 30 24-10 4-20 4-30-2-8-6-10-14 0-22z"/>
  <!-- Eye ring -->
  <circle cx="138" cy="108" r="11" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.4"/>
  <!-- Eye -->
  <circle cx="138" cy="108" r="9.5" fill="#1a1408"/>
  <circle cx="138" cy="108" r="6.8" fill="url(#iris)"/>
  <circle cx="140.5" cy="105.5" r="2.5" fill="#faf0d0"/>
  <circle cx="136" cy="110" r="1.2" fill="#faf0d0" opacity="0.4"/>
  <!-- Brow ridge -->
  <path fill="#5a3e0a" d="M126 96c10-6 22-6 32 0 2 2 0 4-2 4-8-4-18-4-26 0-4 2-6 0-4-4z"/>
  <!-- Beak -->
  <path fill="url(#goldBeak)" d="M166 112c16 4 34 14 44 24 6 6 4 16-4 18-10 2-22-4-30-10-2 8-8 14-16 16-8 2-14-4-14-12 0-14 8-28 20-36z"/>
  <path fill="#3d2c08" d="M176 128c10 6 22 12 30 14-6 6-16 6-26 2-6-2-8-8-4-16z"/>
  <!-- Beak nostril -->
  <ellipse cx="178" cy="120" rx="2.5" ry="1.5" fill="#2a1c06" opacity="0.6"/>
  <!-- Beak highlight -->
  <path fill="#faf0d0" opacity="0.25" d="M170 114c8 2 16 6 22 12-2-8-10-14-22-12z"/>
  <!-- Cere (nose area) -->
  <path fill="#8a6a16" d="M160 108c8 0 14 4 16 10-6 2-12 2-18 0-4-2-4-8 2-10z"/>
  <!-- Feather texture on body -->
  <path fill="none" stroke="#3d2c08" stroke-width="1.2" stroke-linecap="round" opacity="0.4" d="M78 140c18 10 40 16 62 10"/>
  <path fill="none" stroke="#3d2c08" stroke-width="1.0" stroke-linecap="round" opacity="0.35" d="M70 154c22 10 46 14 70 6"/>
  <path fill="none" stroke="#3d2c08" stroke-width="0.8" stroke-linecap="round" opacity="0.3" d="M88 122c14 6 30 8 46 2"/>
  <path fill="none" stroke="#5a3e0a" stroke-width="0.6" stroke-linecap="round" opacity="0.25" d="M64 166c20 8 44 12 66 4"/>
  <path fill="none" stroke="#5a3e0a" stroke-width="0.6" stroke-linecap="round" opacity="0.2" d="M74 176c16 4 34 6 50 0"/>
  <!-- Legs / talons hint -->
  <path fill="#8a6a16" d="M102 192c2 6 2 14 0 20-2 2-4 2-6 0 0-6 0-14 2-20z"/>
  <path fill="#8a6a16" d="M118 194c0 6-2 14-4 18-2 2-4 0-4-2 0-6 2-12 4-18z"/>
  <path fill="#5a3e0a" d="M98 212c4 2 8 2 12 0l-2 6c-2 2-6 2-8 0z"/>
  <path fill="#5a3e0a" d="M112 212c4 0 6-2 8-4l0 6c-2 2-6 2-8 0z"/>
  <!-- Rim light overlay -->
  <circle cx="128" cy="128" r="120" fill="url(#rimLight)"/>
</svg>
